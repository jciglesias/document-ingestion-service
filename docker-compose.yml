services:
  db:
    image: postgres:15-alpine
    container_name: document-ingestion-db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-ingestion-app
    env_file:
      - .env
    ports:
      - "8501:8501"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local